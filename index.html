<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Deck</title>
    <meta name="description" content="" />
    <!-- Inline so the tab is right before fullscreen, and nothing is ever fetched. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0c0f'/%3E%3Cpath d='M16 7v8M16 15l-7 10M16 15l7 10' stroke='%235e7c93' stroke-width='1.6' fill='none'/%3E%3Ccircle cx='16' cy='7' r='3.4' fill='%23e4a33c'/%3E%3C/svg%3E"
    />
    <!--
      Theme is resolved before first paint so a light-mode viewer never sees a dark flash.
      Order: ?theme= in the URL → last choice in this browser → OS preference.
      The same logic lives in src/engine/theme.js; keep the two in sync.
    -->
    <script>
      ;(function () {
        var q = new URLSearchParams(location.search).get('theme')
        var saved = null
        try {
          saved = localStorage.getItem('deck.theme')
        } catch (e) {}
        var pick =
          q === 'light' || q === 'dark'
            ? q
            : saved === 'light' || saved === 'dark'
              ? saved
              : matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
        document.documentElement.dataset.theme = pick
      })()
    </script>
  </head>
  <body>
    <canvas id="stage" aria-hidden="true"></canvas>
    <div id="stage-fallback" aria-hidden="true" hidden></div>

    <div class="theme" id="theme" role="group" aria-label="Color theme">
      <button class="theme__opt" type="button" data-theme-opt="dark" aria-pressed="true">Dark</button>
      <span class="theme__sep" aria-hidden="true">/</span>
      <button class="theme__opt" type="button" data-theme-opt="light" aria-pressed="false">Light</button>
    </div>

    <div class="deck" id="deck">
      <nav class="rail" id="rail" aria-label="Slides"></nav>

      <main class="content" id="content" tabindex="-1"></main>

      <footer class="hud">
        <span class="hud__pos" id="hud-pos"></span>
        <span class="hud__hint" id="hud-hint"></span>
      </footer>
    </div>

    <aside class="panel" id="panel" aria-hidden="true" role="dialog" aria-modal="false" aria-labelledby="panel-title">
      <header class="panel__head">
        <div class="panel__meta">
          <span class="panel__kind" id="panel-kind"></span>
          <span class="panel__path" id="panel-path"></span>
        </div>
        <button class="panel__close" id="panel-close" type="button" aria-label="Close (Esc)">Esc</button>
      </header>
      <h2 class="panel__title" id="panel-title"></h2>
      <div class="panel__body" id="panel-body"></div>
    </aside>

    <section class="overview" id="overview" aria-hidden="true" hidden>
      <h2 class="overview__title">Slides</h2>
      <ol class="overview__grid" id="overview-grid"></ol>
    </section>

    <section class="help" id="help" aria-hidden="true" hidden>
      <div class="help__card">
        <h2 class="help__title">Controls</h2>
        <dl class="help__list" id="help-list"></dl>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
